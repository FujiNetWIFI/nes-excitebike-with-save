# newbank.cfg -- the new $8000-$BFFF bank of the NROM-256 Excitebike image.
# Output is exactly 16384 bytes; build.py places it in front of the original
# PRG. The FRAG window at $BFF0 holds the relocated $FFF0-$FFFF bytes.
MEMORY {
    BANK: start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    FRAG: start = $BFF0, size = $0010, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    CODE:   load = BANK, type = ro;
    RODATA: load = BANK, type = ro;
    FRAG:   load = FRAG, type = ro;
}
